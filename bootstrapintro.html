<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John Pork is missing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-4">
    <div class="col-md-8 col-lg-6 mx-auto">
      <h1 class="display-4 text-center text-bg-warning p-3">John Pork is missing</h1>
      <p>John Pork is a man with a serious sock-stealing problem.</p>
      <p>Last seen at the park chasing his rival, tim cheese</p>
      <p>He answers to pork chop and the sound of skibidi toilet.</p>
      <p class="border border-warning border-3 p-3">Reward: Free john pork shirt</p>

      <div id="john" class="carousel slide mb-3">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://i.scdn.co/image/ab67616d0000b273ffe8ad517ca19e5e1edf2ff3"
                 class="d-block w-100 img-fluid" alt="john dog">
          </div>
          <div class="carousel-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKhgeZ4bsNAUficOOXR8dD5uBQ6XAhYV7C04-2padEwoYjqKcuCHxpPLc&s=10"
                 class="d-block w-100 img-fluid" alt="dog john">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#john" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#john" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <a href="https://www.petfinder.com/" class="btn btn-primary btn-lg active mb-4">Search Petfinder</a>

      <h2>Have you seen John Pork?</h2>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Your name</label>
          <input type="text" class="form-control" id="name" name="name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Your email</label>
          <input type="email" class="form-control" id="email" name="email">
        </div>
        <div class="mb-3">
          <label for="location" class="form-label">Where did you see him?</label>
          <textarea class="form-control" id="location" name="location" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-secondary btn-sm" disabled>Send report (not working yet)</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
